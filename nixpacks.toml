# Railway / Nixpacks config — superseded by Dockerfile.
#
# When a Dockerfile is present Railway uses it directly (Docker build), so
# this file is not active.  It is kept for reference only.
#
# wgrib2 is NOT available as a Debian or Nix package; it must be compiled
# from NCEP source.  See Dockerfile for the multi-stage build that does this.

[phases.setup]
aptPkgs = ["ca-certificates", "curl"]
